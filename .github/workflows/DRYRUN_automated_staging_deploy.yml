name: '[DRY-RUN] Automated staging deploy - NO REAL DEPLOYMENTS'
on:
  push:
    branches:
      - test/pr-12707-validation
  workflow_dispatch:
  # merge_group: # DISABLED

env:
  base_sha: ${{ github.event.merge_group.base_sha }}
  head_sha: ${{ github.event.merge_group.head_sha }}
  package_weights: '@scm/frontend:40,@informa/content-api:40,@informa/redirects-api-lambda:40,@informa/inbound-content-lambda:20,@informa/extensions-lambda:10,@informa/sitemap-lambda:10'
  max-per-unit-agent: '40'
  max-per-typescript-agent: '80'

jobs:
  setup:
    name: Setup CI/CD
    outputs:
      all_matrix_preview: ${{ steps.set-matrix-preview.outputs.all_matrix }}
      all_matrix_staging: ${{ steps.set-matrix-staging.outputs.all_matrix }}
      nx_affected: ${{ steps.nx-affected.outputs.nx-affected }}
      shouldRunContentE2E: ${{ steps.nx-affected.outputs.shouldRunContentE2E }}
      frontend_matrix_preview: ${{ steps.set-matrix-preview.outputs.frontend_matrix }}
      frontend_matrix_staging: ${{ steps.set-matrix-staging.outputs.frontend_matrix }}
      frontend_component_library: ${{ steps.set-matrix-preview.outputs.frontend_component_library }}
      lambda2_matrix_preview: ${{ steps.set-matrix-preview.outputs.lambda2_matrix }}
      lambda2_matrix_staging: ${{ steps.set-matrix-staging.outputs.lambda2_matrix }}
      content_api_matrix_preview: ${{ steps.set-matrix-preview.outputs.content_api_matrix }}
      content_api_matrix_staging: ${{ steps.set-matrix-staging.outputs.content_api_matrix }}
      ui_matrix_staging: ${{ steps.set-matrix-staging.outputs.ui_matrix }}
      worker_matrix_staging: ${{ steps.set-matrix-staging.outputs.worker_matrix }}
      unit_test_agents: ${{ steps.calculate-unit-test-agents.outputs.test_agents }}
      typescript_test_agents: ${{ steps.calculate-typescript-test-agents.outputs.test_agents }}
      branch_name: ${{ steps.branch-name.outputs.current_branch }}
      skip_deployment: ${{ steps.check_all_matrix.outputs.skip_deployment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      actions: write
      checks: write
      issues: write
      pull-requests: write
      statuses: write
      deployments: write
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install_deps
        timeout-minutes: 10
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'false'

      - name: Get NX Affected Packages
        id: nx-affected
        uses: ./.github/actions/nx_affected_packages
        with:
          base-sha: '${{ env.base_sha }}'
          head-sha: '${{ env.head_sha }}'

      - name: Get all packages
        id: all-packages
        uses: InformaPLC/scm-get-all-packages-action@v1.0.2

      - name: Get Packages Metadata Preview
        uses: InformaPLC/scm-changed-packages-metadata-action@v1.0.12
        with:
          allPackages: ${{ steps.all-packages.outputs.allPackages }}
          affected: ${{ steps.nx-affected.outputs.nx-affected }}
          outputFilename: tools/cli/src/matrix/changed.generated.preview.json
          environment: preview

      - name: Get Packages Metadata staging
        uses: InformaPLC/scm-changed-packages-metadata-action@v1.0.12
        with:
          allPackages: ${{ steps.all-packages.outputs.allPackages }}
          affected: ${{ steps.nx-affected.outputs.nx-affected }}
          outputFilename: tools/cli/src/matrix/changed.generated.staging.json
          environment: staging

      - name: Output changed generated preview json
        id: changedGeneratedPreview
        run: |
          cat tools/cli/src/matrix/changed.generated.preview.json
          echo "changedGeneratedPreview=$(cat tools/cli/src/matrix/changed.generated.preview.json)" >> $GITHUB_OUTPUT

      - name: Output changed generated staging json
        id: changedGeneratedStaging
        run: |
          cat tools/cli/src/matrix/changed.generated.staging.json
          echo "changedGeneratedStaging=$(cat tools/cli/src/matrix/changed.generated.staging.json)" >> $GITHUB_OUTPUT

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v9

      - name: Set matrix Preview
        id: set-matrix-preview
        uses: InformaPLC/scm-matrix-action@v1.0.13
        with:
          matrixEnv: preview
          changedGenerated: ${{ steps.changedGeneratedPreview.outputs.changedGeneratedPreview }}
        env:
          ENVIRONMENT: preview
          CURRENT_BRANCH: ${{ steps.branch-name.outputs.current_branch }}
          GITHUB_PR_NUM: ${{ github.event.number }}

      - name: Set matrix Staging
        id: set-matrix-staging
        uses: InformaPLC/scm-matrix-action@v1.0.13
        with:
          matrixEnv: staging2
          changedGenerated: ${{ steps.changedGeneratedStaging.outputs.changedGeneratedStaging }}
        env:
          ENVIRONMENT: staging
          CURRENT_BRANCH: ${{ steps.branch-name.outputs.current_branch }}
          GITHUB_PR_NUM: ${{ github.event.number }}

      - name: Install node_modules for actions
        id: install_actions_node_modules
        uses: bahmutov/npm-install@v1
        with:
          working-directory: ./.github/actions/setup-agent
          useLockFile: false

      - name: Setup unit test agents
        id: calculate-unit-test-agents
        uses: ./.github/actions/setup-agent
        with:
          packages: '${{ steps.set-matrix-preview.outputs.all_matrix }}'
          weights: '${{ env.package_weights }}'
          max-per-agent: '${{ env.max-per-unit-agent }}'

      - name: Setup typescript test agents
        id: calculate-typescript-test-agents
        uses: ./.github/actions/setup-agent
        with:
          packages: '${{ steps.set-matrix-preview.outputs.all_matrix }}'
          max-per-agent: '${{ env.max-per-typescript-agent }}'

      - name: Check matrix for empty
        id: check_all_matrix
        run: |
          if [[ "${{ steps.set-matrix-preview.outputs.all_matrix }}" == "" ]]; then
            echo "skip_deployment=true"
            echo "skip_deployment=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deployment=false"
            echo "skip_deployment=false" >> $GITHUB_OUTPUT
          fi

  unit_tests:
    name: Tests |> test:unit:ci
    runs-on: ubuntu22-8core
    if: needs.setup.outputs.skip_deployment == 'false'
    needs: setup
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      actions: write
    env:
      bucket-test-reports: 's3://preview-scm-test-reports-bucket'
    outputs:
      lcov-artifact-upload: ${{ steps.check-lcov.outputs.lcov-artifact-upload }}
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.setup.outputs.unit_test_agents) }}
        action: ['test:unit:ci']
    timeout-minutes: 40
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install node_modules for actions
        id: install_actions_node_modules
        uses: bahmutov/npm-install@v1
        with:
          working-directory: ./.github/actions/split-packages-list
          useLockFile: false

      - name: Get test packages
        uses: ./.github/actions/split-packages-list
        with:
          packages: '${{ needs.setup.outputs.all_matrix_preview }}'
          agent: '${{ matrix.agent }}'
          weights: '${{ env.package_weights }}'
          max-per-agent: '${{ env.max-per-unit-agent }}'

      - name: Install Dependencies
        if: env.package_string != 'SKIP'
        uses: ./.github/actions/install_deps
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'true'

      # - name: configure aws credentials
      #   if: env.package_string != 'SKIP'
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   # with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::050114398921:role/preview-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: us-east-1

      - name: Tests test:unit:ci
        if: env.package_string != 'SKIP'
        shell: bash
        run: |
          yarn ${{ matrix.action }} --projects=${{ env.package_string }} --verbose

      - name: group lcov.info
        if: env.package_string != 'SKIP'
        run: |
          mkdir -p lcov_reports
          find {packages,services} -name "lcov.info" -exec sh -c 'mkdir -p lcov_reports/unit_test_${{ matrix.agent }}/$(dirname {}) && cp {} lcov_reports/unit_test_${{ matrix.agent }}/$(dirname {})' \;

      - name: Upload coverage files
        if: env.package_string != 'SKIP'
        id: lcov-artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: lcov-unit-${{ matrix.agent }}
          path: lcov_reports/
        continue-on-error: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: env.package_string != 'SKIP'
        with:
          check_name: 'Unit Test Results'
          files: |
            **/reports/report.xml
        continue-on-error: true

      - name: Cancel if failure
        if: failure()
        uses: andymckay/cancel-action@0.4

  typescript_tests:
    name: Tests |> test:typescript:ci
    runs-on: ubuntu22-4core
    if: needs.setup.outputs.skip_deployment == 'false'
    needs: setup
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      actions: write
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.setup.outputs.typescript_test_agents) }}
        action: ['test:typescript:ci']
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install node_modules for actions
        id: install_actions_node_modules
        uses: bahmutov/npm-install@v1
        with:
          working-directory: ./.github/actions/split-packages-list
          useLockFile: false

      - name: Get test packages
        uses: ./.github/actions/split-packages-list
        with:
          packages: '${{ needs.setup.outputs.all_matrix_preview }}'
          agent: '${{ matrix.agent }}'
          max-per-agent: '${{ env.max-per-typescript-agent }}'

      - name: Install Dependencies
        if: env.package_string != 'SKIP'
        uses: ./.github/actions/install_deps
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'true'

      # - name: configure aws credentials
      #   if: env.package_string != 'SKIP'
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   # with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::050114398921:role/preview-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: us-east-1

      - name: Tests test:typescript:ci
        if: env.package_string != 'SKIP'
        shell: bash
        run: |
          yarn ${{ matrix.action }} --projects=${{ env.package_string }} --runner=remotecache-s3 --verbose --base=${{ env.base_sha }} --head=${{ env.head_sha }}

      - name: Cancel if failure
        if: failure()
        uses: andymckay/cancel-action@0.4

  integration_tests:
    name: Tests |> test:integration:ci
    runs-on: ubuntu22-4core
    if: needs.setup.outputs.skip_deployment == 'false'
    needs: setup
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      actions: write
    env:
      bucket-test-reports: 's3://preview-scm-test-reports-bucket'
    outputs:
      lcov-artifact-upload: ${{ steps.check-lcov.outputs.lcov-artifact-upload }}
    timeout-minutes: 40
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install_deps
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'true'

      # - name: configure aws credentials
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   # with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::050114398921:role/preview-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: us-east-1

      - name: Tests test:integration:ci
        shell: bash
        run: |
          yarn test:integration:ci --verbose --base=${{ env.base_sha }} --head=${{ env.head_sha }}

      - name: group lcov.info
        run: |
          mkdir -p lcov_reports
          find {packages,services} -name "lcov.info" -exec sh -c 'mkdir -p lcov_reports/integration_test/$(dirname {}) && cp {} lcov_reports/integration_test/$(dirname {})' \;

      - name: Upload coverage files
        id: lcov-artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: lcov-integration
          path: lcov_reports/
        continue-on-error: true

      - name: Cancel if failure
        if: failure()
        uses: andymckay/cancel-action@0.4

  lint_format_tests:
    if: needs.setup.outputs.skip_deployment == 'false'
    name: Tests |> test:lint, test:format
    runs-on: ubuntu22-4core
    needs: setup
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      pages: write
      actions: write
    timeout-minutes: 40
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install_deps
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'false'

      # - name: configure aws credentials
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   # with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::050114398921:role/preview-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: us-east-1

      - name: Tests test:lint test:format
        shell: bash
        run: |
          yarn test:lint --runner=remotecache-s3 --verbose --base=${{ env.base_sha }} --head=${{ env.head_sha }}
          yarn test:format --runner=remotecache-s3 --verbose --base=${{ env.base_sha }} --head=${{ env.head_sha }}

  frontend_component_library:
    name: Frontend Component Library |> ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.frontend_component_library) }}
    needs: setup
    runs-on: ubuntu22-4core
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      actions: write
    outputs:
      skipped: ${{ steps.check_skip.outputs.skipped }}
    steps:
      - name: Checkout the repository
        if: matrix.isFull || matrix.isPartial
        uses: actions/checkout@v4
        with:
          ref: ${{ env.head_sha }}
          fetch-depth: 0

      - name: Install Dependencies
        if: matrix.isFull || matrix.isPartial
        uses: ./.github/actions/install_deps
        timeout-minutes: 10
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'true'

      - name: Build; Deploy; Storybook and Component tests
        if: matrix.run
        uses: ./.github/actions/frontend_component_library/1-build-deploy-storybook
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROMATIC_TOKEN_SCM: ${{ secrets.CHROMATIC_TOKEN_SCM }}

      - name: Upload storybook-static
        if: matrix.run
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: ./services/frontend/storybook-static

      - name: Check Skip
        id: check_skip
        run: |
          if [[ "${{ matrix.run }}" == "true" ]]; then
            echo "skipped=false" >> $GITHUB_OUTPUT
          else
            echo "skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Cancel if failure
        if: failure()
        uses: andymckay/cancel-action@0.4

  matrix_test_parallelization:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix_test_parallelization.outputs.matrix }}
    needs: setup
    steps:
      - name: Create matrix for tests
        id: matrix_test_parallelization
        uses: bahmutov/gh-build-matrix@main
        with:
          n: 5 # number of containers to output

      - name: Print result 🖨
        run: echo '${{ steps.matrix_test_parallelization.outputs.matrix }}'

      - name: Cancel if failure
        if: failure()
        uses: andymckay/cancel-action@0.4

  frontend_component_library_tests:
    needs:
      - setup
      - frontend_component_library
      - matrix_test_parallelization
    if: ${{ needs.frontend_component_library.outputs.skipped == 'false' }}
    runs-on: ubuntu22-8core
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix_test_parallelization.outputs.matrix) }}
    permissions:
      id-token: write
      contents: write
      packages: write
      issues: read
      checks: write
      pull-requests: write
      actions: write
    env:
      SCREENSHOT_FOLDER: '/home/runner/work/smart-connections-monorepo/smart-connections-monorepo/services/frontend/cypress/screenshots/'
      JUNIT_FILES: '/home/runner/work/smart-connections-monorepo/smart-connections-monorepo/services/frontend/cypress/results/component/junit.xml'
      check_skip: ${{needs.frontend_component_library.outputs.check_skip}}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.head_sha }}
          fetch-depth: 0

      - name: Install Dependencies
        uses: ./.github/actions/install_deps
        timeout-minutes: 10
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'true'

      - name: Download storybook-static
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: ./services/frontend/storybook-static

      - name: Serve Storybook
        shell: bash
        run: |
          yarn nx run @scm/frontend:storybook:serve:ci

      - name: Run split Cypress tests 🧪
        uses: cypress-io/github-action@v6
        with:
          install: false
          project: ./services/frontend
          config-file: cypress.config.storybook.ts
          browser: electron
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_AFFECTED: ${{ needs.setup.outputs.nx_affected }}
          NODE_OPTIONS: '--no-experimental-require-module --no-experimental-detect-module'

      - name: Upload cypress-screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: ${{ env.SCREENSHOT_FOLDER }}

  frontend_matrix_preview:
    name: Frontend |> ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.frontend_matrix_preview) }}
    needs: setup
    runs-on: ubuntu22-8core
    permissions:
      actions: write
      id-token: write
      contents: write
      packages: write
      security-events: write
    steps:
      - name: Checkout the repository
        if: matrix.run
        uses: actions/checkout@v4

      - name: Install Dependencies
        if: matrix.run
        uses: ./.github/actions/install_deps
        timeout-minutes: 10
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          setup: 'false'

      - name: AWS credentials; Login to ECR; Docker Context for Buildx; Set up Docker Buildx; Install volta cli;
        if: matrix.run
        id: login-ecr
        uses: ./.github/actions/container_matrix/1-aws-docker-volta_cli

      - name: Build, tag and push image to Amazon ECR; Get Infra Vars
        if: matrix.run
        uses: ./.github/actions/container_matrix/2-build-vars
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          login-ecr: ${{ steps.login-ecr.outputs.registry }}

      - name: Get type of branch
        if: matrix.run
        run: |
          import os
          with open(os.getenv('GITHUB_ENV'), "a") as myfile:
            myfile.write(f"branch_type={'${{ github.head_ref }}'.split('/')[0]}\n")
          print(f"${{ github.head_ref }}".split('/')[0])
        shell: python

      - name: Render ECS task definition; Create Target Group and Listener Rule; Create/update ECS service; Update CloudFlare; Run container image; Wait for Service
        if: matrix.run
        uses: ./.github/actions/container_matrix/3-ecs-dns
        with:
          login-ecr: ${{ steps.login-ecr.outputs.registry }}

      - name: Apply New Relic Deployment Marker
        if: matrix.run
        continue-on-error: true
        uses: InformaPLC/newrelic-deployment-marker-action@v1.0.3
        with:
          name: preview-frontend-pr-${{ matrix.prNum }}
          type: apm
          region: EU
          version: ${{ matrix.prNum }}

      - name: Wait for ECS Service
        if: matrix.run
        uses: ./.github/actions/container_matrix/tests-ecs

  content_api_matrix_preview:
    name: Content API |> ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.content_api_matrix_preview) }}
    needs: setup
    runs-on: ubuntu22-4core
    permissions:
      actions: write
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout the repository
        if: matrix.run
        uses: actions/checkout@v4

      - name: AWS credentials; Login to ECR; Docker Context for Buildx; Set up Docker Buildx; Install volta cli;
        if: matrix.run
        id: login-ecr
        uses: ./.github/actions/container_matrix/1-aws-docker-volta_cli

      - name: Build, tag and push image to Amazon ECR; Get Infra Vars
        if: matrix.run
        uses: ./.github/actions/container_matrix/2-build-vars
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          login-ecr: ${{ steps.login-ecr.outputs.registry }}

      - name: Get type of branch
        if: matrix.run
        run: |
          import os
          with open(os.getenv('GITHUB_ENV'), "a") as myfile:
            myfile.write(f"branch_type={'${{ github.head_ref }}'.split('/')[0]}\n")
          print(f"${{ github.head_ref }}".split('/')[0])
        shell: python

      - name: Render ECS task definition; Create Target Group and Listener Rule; Create/update ECS service; Update CloudFlare; Run container image; Wait for Service
        if: matrix.run
        uses: ./.github/actions/container_matrix/3-ecs-dns
        with:
          login-ecr: ${{ steps.login-ecr.outputs.registry }}

  lambda2_matrix_preview:
    name: Lambda2 |> ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.lambda2_matrix_preview) }}
    needs: setup
    runs-on: ubuntu22-4core
    permissions:
      actions: write
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout the repository
        if: matrix.run && matrix.vertical == 'unified'
        uses: actions/checkout@v4

      - name: Get type of branch
        if: matrix.run
        run: |
          import os
          with open(os.getenv('GITHUB_ENV'), "a") as myfile:
            myfile.write(f"branch_type={'${{ github.head_ref }}'.split('/')[0]}\n")
          print(f"${{ github.head_ref }}".split('/')[0])
        shell: python

      - name: aws credentials; Login to ECR; Get and extract latest New Relic Lambda Layer; Build, tag and push Lambda Docker image to Amazon ECR
        if: matrix.run
        id: login-ecr
        uses: ./.github/actions/lambda2/1-test-aws-build
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lambda - Version Cleanup / Storage Check; Set Alias; Lambda Deploy
        if: matrix.run
        uses: ./.github/actions/lambda2/3-alias-deploy

      - name: Apply New Relic Deployment Marker
        if: matrix.run
        continue-on-error: true
        uses: InformaPLC/newrelic-deployment-marker-action@v1.0.3
        with:
