  staging_rollback:
    name: Staging rollback
    if: ${{ always() && ((needs.e2e_tests_smokes.result == 'failure') || (needs.e2e_tests_smokes.result == 'canceled') || (fromJson(needs.e2e_tests.outputs.passRate || '0') < 95)) }}
    needs:
      - setup
      - e2e_tests
      - e2e_tests_smokes
      - after_staging
      - frontend_matrix_staging
      - content_api_matrix_staging
    uses: ./.github/workflows/staging_rollback.yml
    with:
      nx_affected: ${{ needs.setup.outputs.nx_affected }}
      pr_number_frontend: ${{ needs.frontend_matrix_staging.outputs.live_pr_number }}
      pr_number_content_api: ${{ needs.content_api_matrix_staging.outputs.live_pr_number }}
    secrets: inherit

  content_api_matrix_live_preview:
    name: Content API LIVE preview |> ${{ matrix.name }}
    if: ${{ !cancelled() && (needs.e2e_tests_smokes.result != 'failure' && (fromJson(needs.e2e_tests.outputs.passRate || '0') >= 95) && needs.after_staging.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.content_api_matrix_preview) }}
    needs:
      - setup
      - e2e_tests
      - e2e_tests_smokes
      - after_staging
    runs-on: ubuntu22-4core
    permissions:
      actions: write
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout the repository
        if: matrix.run
        uses: actions/checkout@v4

      # - name: configure aws credentials
      #   if: matrix.run
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::${{ matrix.accountId }}:role/${{ matrix.environment }}-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: ${{ matrix.awsRegion }}

      - name: Login to Amazon ECR
        if: matrix.run
        id: login-ecr-live
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Render Amazon ECS task definition
        if: matrix.run
        uses: InformaPLC/find-and-replace-action@v1.0.2
        with:
          input: services/${{ matrix.shortName }}/src/config/${{ matrix.environment }}/task-definition-live-version.json
          output: services/${{ matrix.shortName }}/src/config/${{ matrix.environment }}/task-definition-output.json
          echo_output: 'true'
          replacement_values: '{"${IMAGE}": "${{ steps.login-ecr-live.outputs.registry }}/content:${{ matrix.prNum }}", "${NRI_IMAGE}": "${{ steps.login-ecr-live.outputs.registry }}/nri-ecs:latest", "${SM_IMAGE}": "${{ steps.login-ecr-live.outputs.registry }}/secrets-manager-agent:latest"}'

      - name: Wait for existing CodeDeploy deployment to complete
        uses: InformaPLC/codedeploy-wait-for-deployments-action@v1.0.1
        if: matrix.run
        timeout-minutes: 10
        with:
          application: ${{ matrix.environment }}-content
          deployment_group: ${{ matrix.environment }}-content

      # - name: Deploy to Amazon ECS
      #   # DRYRUN:         uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   if: matrix.run
      #   id: deploy-to-ecs
      #   # DRYRUN:         with:
      #     # DRYRUN:           task-definition: services/${{ matrix.shortName }}/src/config/${{ matrix.environment }}/task-definition-output.json
      #     # DRYRUN:           service: ${{ matrix.environment }}-content
      #     # DRYRUN:           cluster: ${{ matrix.environment }}-content
      #     # wait-for-service-stability: false
      #     # DRYRUN:           codedeploy-appspec: services/${{ matrix.shortName }}/src/config/${{ matrix.environment }}/appspec.json
      #     # DRYRUN:           codedeploy-application: ${{ matrix.environment }}-content
      #     # DRYRUN:           codedeploy-deployment-group: ${{ matrix.environment }}-content

      - name: Check for CodeDeploy Completion
        uses: InformaPLC/codedeploy-completion-check-action@v1.0.1
        if: matrix.run
        with:
          deployment_id: ${{ steps.deploy-to-ecs.outputs.codedeploy-deployment-id }}

      # - name: Deploy to Amazon ECS test
      #   # DRYRUN:         uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   if: matrix.run
        # DRYRUN:         with:
          # DRYRUN:           task-definition: services/${{ matrix.shortName }}/src/config/${{ matrix.environment }}/task-definition-output.json
          # DRYRUN:           service: ${{ matrix.environment }}-content-test
          # DRYRUN:           cluster: ${{ matrix.environment }}-content
          # wait-for-service-stability: false

  lambda2_matrix_staging_live:
    name: Lambda2 update LIVE alias |> ${{ matrix.name }}
    if: ${{ !cancelled() && (needs.e2e_tests_smokes.result != 'failure' && (fromJson(needs.e2e_tests.outputs.passRate) || 0 >= 95) && needs.after_staging.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.lambda2_matrix_staging) }}
    needs:
      - setup
      - e2e_tests
      - e2e_tests_smokes
      - after_staging
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout the repository
        if: matrix.run
        uses: actions/checkout@v4

      # - name: configure aws credentials
      #   if: matrix.run
      #   # DRYRUN: uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     # DRYRUN: role-to-assume: arn:aws:iam::${{ matrix.accountId }}:role/${{ matrix.environment }}-cicd-role
      #     # DRYRUN: role-session-name: SCM-CICD
      #     # DRYRUN: aws-region: ${{ matrix.awsRegion }}

      - name: Update LIVE alias
        if: matrix.run
        run: |
          version=$(aws lambda get-alias --function-name ${{ matrix.environment }}-${{ matrix.shortName }} --name 'PRE-LIVE' --query 'FunctionVersion' --output text)
          aws lambda update-alias --function-name ${{ matrix.environment }}-${{ matrix.shortName }} --function-version $version --name 'LIVE'

      - name: Login to Amazon ECR
        if: matrix.run
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # - name: Lambda Deploy Lambda Stable to Preview LIVE Alias
      #   if: matrix.run && matrix.vertical == 'unified'
      # # DRYRUN:         uses: InformaPLC/lambda-deploy-action@v1.0.3
      #   with:
      #   # DRYRUN:           function_name: preview-${{ matrix.shortName }}
      #   # DRYRUN:           lambda_type: 'container'
      #   # DRYRUN:           container_image: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.shortName }}:${{ matrix.prNum }}
      #     architecture: 'x86_64'
      #     codedeploy_enabled: 'yes'
      #     version_description: pr-${{ matrix.prNum }}:main
      #     codedeploy_app_name: preview-${{ matrix.shortName }}
      #     codedeploy_dg_name: preview-${{ matrix.shortName }}
      #   # DRYRUN:           lambda_alias: 'LIVE'

  after:
    name: Check job results
    if: always()
    runs-on: ubuntu-latest
    needs:
      - after_preview
      - after_staging
      - e2e_tests
      - e2e_tests_smokes
      - e2e_iiris_tests
      # - e2e_webhooks
      - lambda2_matrix_staging_live
      - content_api_matrix_live_preview
    steps:
      - name: Check pipeline status
        run: |
          echo "after_preview = ${{ needs.after_preview.result }}"
          echo "after_staging = ${{ needs.after_staging.result }}"
          echo "e2e_tests = ${{ needs.e2e_tests.result }}"
          echo "e2e_tests_pass_rate = ${{ needs.e2e_tests.outputs.passRate }}"
          echo "e2e_tests_smokes = ${{ needs.e2e_tests_smokes.result }}"
          echo "e2e_tests_smokes_pass_rate = ${{ needs.e2e_tests_smokes.outputs.passRate }}"
          echo "e2e_iriis_tests = ${{ needs.e2e_iiris_tests.result }}"
          echo "e2e_iriis_tests_pass_rate = ${{ needs.e2e_iiris_tests.outputs.passRate }}"
          echo "lambda2_matrix_staging_live = ${{ needs.lambda2_matrix_staging_live.result }}"
          echo "content_api_matrix_live_preview = ${{ needs.content_api_matrix_live_preview.result }}"
          if [ "${{ needs.after_preview.result }}" != "success" ] || \
              [ "${{ needs.after_staging.result }}" != "success" ] || \
              [ "${{ needs.lambda2_matrix_staging_live.result }}" != "success" ] || \
              [ "${{ needs.content_api_matrix_live_preview.result }}" != "success" ]
          then
            echo "Pipeline failed, check the logs on other steps please."
            exit 1
          fi
          if [ "${{ needs.e2e_tests_smokes.result }}" == "success" ] || \
              [ "${{ needs.e2e_tests_smokes.result }}" == "skipped" ]
          then
            echo "Pipeline passed! hooray!!"
          else
            echo "Pipeline failed, check the logs on other steps please."
            exit 1
          fi
