              [ "${{ needs.lambda2_matrix_preview.result }}" != "success" ] || \
              [ "${{ needs.content_api_matrix_preview.result }}" != "success" ]
          then
            echo "Pipeline failed, check the logs on other steps please."
            exit 1
          fi

          if [ \
            \( "${{ needs.typescript_tests.result }}" == "success" -o "${{ needs.typescript_tests.result }}" == "skipped" \) -a \
            \( "${{ needs.integration_tests.result }}" == "success" -o "${{ needs.integration_tests.result }}" == "skipped" \) -a \
            \( "${{ needs.lint_format_tests.result }}" == "success" -o "${{ needs.lint_format_tests.result }}" == "skipped" \) -a \
            \( "${{ needs.unit_tests.result }}" == "success" -o "${{ needs.unit_tests.result }}" == "skipped" \) -a \
            \( "${{ needs.frontend_component_library.result }}" == "success" -o "${{ needs.frontend_component_library.result }}" == "skipped" \) -a \
            \( "${{ needs.content_api_e2e.result }}" == "success" -o "${{ needs.content_api_e2e.result }}" == "skipped" \) \
          ]; then
