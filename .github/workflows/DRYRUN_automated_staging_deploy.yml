        run: |
          # Get the ECS current Service JSON
          SERVICE_JSON=$(aws ecs describe-services --cluster "${{ matrix.environment }}-content" --services "${{ matrix.environment }}-content" --query "services[0].taskDefinition" --output text)

          IMAGE_TAG=$(aws ecs describe-task-definition --task-definition "$SERVICE_JSON" --query "taskDefinition.containerDefinitions[0].image" --output text | cut -d ':' -f 2)

          if [ ! -z "$IMAGE_TAG" ]; then
            echo "Live PR Number/Image Tag: $IMAGE_TAG"
            echo "LIVE_PR_NUMBER=$IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            echo "No PR Number found."
